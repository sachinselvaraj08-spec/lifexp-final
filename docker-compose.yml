version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifexp-postgres
    restart: always
    environment:
      POSTGRES_USER: lifexp
      POSTGRES_PASSWORD: lifexppassword
      POSTGRES_DB: lifexp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lifexp-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: lifexp-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://lifexp:lifexppassword@postgres:5432/lifexp_db
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: lifexp-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
